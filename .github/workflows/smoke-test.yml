name: smoke-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pywin32

      - name: Verify hidden imports
        run: |
          python -c "import mss, mss.windows, mss.windows.gdi, win32gui, dashscope, PySide6, PIL; print('OK')"

      - name: Import check
        run: |
          python -c "
          import importlib
          for m in ['screenshot','vision','decision','pet_chat','memory','floating_widget','config','logger','action_analyzer','neglect_watcher','telemetry','train_export','train_submit']:
            importlib.import_module(m); print(f'OK: {m}')
          "

      - name: Build dry-run (no real PyInstaller run; just check spec syntax)
        run: |
          python -c "import ast; ast.parse(open('main.spec').read())"
